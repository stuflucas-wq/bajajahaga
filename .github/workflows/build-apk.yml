
name: Build QRIS Notify Bridge Diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP Project
        run: unzip -q qris-notify-diagnostik-v1.2.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p source/android :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: QRIS-Notify-Bridge-v1.2
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
